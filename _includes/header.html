<header class="site-header">
  <nav class="navbar navbar-expand-md navbar-light site-nav" aria-label="Primary navigation">
    <div class="container">
      <a class="navbar-brand site-brand" href="{{ '/' | relative_url }}" aria-label="Xiang Li, home">
        <span class="brand-mark" aria-hidden="true">XL</span>
        <span class="brand-name">Xiang Li</span>
      </a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#primaryNav" aria-controls="primaryNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="primaryNav">
        <ul class="navbar-nav ml-auto align-items-md-center">
          <li class="nav-item{% if page.permalink == '/' %} active{% endif %}">
            <a class="nav-link" href="{{ '/' | relative_url }}">Home</a>
          </li>
          <li class="nav-item{% if page.url contains '/overview/' %} active{% endif %}">
            <a class="nav-link" href="{{ '/overview/' | relative_url }}">Research</a>
          </li>
          <li class="nav-item{% if page.url contains '/research/' %} active{% endif %}">
            <a class="nav-link" href="{{ '/research/' | relative_url }}">Publications</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
